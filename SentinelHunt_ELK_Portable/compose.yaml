{
  "name": "se6014-sentinelhunt-portable",
  "services": {
    "setup": {
      "image": "docker.elastic.co/elasticsearch/elasticsearch:8.19.23",
      "mem_limit": "512m",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "user": "0",
      "network_mode": "none",
      "hostname": "cert-setup",
      "extra_hosts": [
        "cert-setup:127.0.0.1"
      ],
      "volumes": [
        "certs:/usr/share/elasticsearch/config/certs",
        "./config/create-certs.sh:/bootstrap/create-certs.sh:ro"
      ],
      "entrypoint": [
        "bash",
        "/bootstrap/create-certs.sh"
      ]
    },
    "elasticsearch": {
      "image": "docker.elastic.co/elasticsearch/elasticsearch:8.19.23",
      "mem_limit": "2g",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "env_file": [
        "./runtime/elasticsearch.env"
      ],
      "environment": {
        "node.name": "portable-es01",
        "cluster.name": "sentinelhunt-portable",
        "discovery.type": "single-node",
        "ES_JAVA_OPTS": "-Xms512m -Xmx512m",
        "xpack.security.enabled": "true",
        "xpack.security.autoconfiguration.enabled": "false",
        "xpack.security.http.ssl.enabled": "true",
        "xpack.security.http.ssl.key": "certs/elasticsearch/elasticsearch.key",
        "xpack.security.http.ssl.certificate": "certs/elasticsearch/elasticsearch.crt",
        "xpack.security.http.ssl.certificate_authorities": "certs/ca/ca.crt"
      },
      "ports": [
        "127.0.0.1:19200:9200"
      ],
      "volumes": [
        "esdata:/usr/share/elasticsearch/data",
        "certs:/usr/share/elasticsearch/config/certs:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -sf --cacert config/certs/ca/ca.crt -u \"elastic:$${ELASTIC_PASSWORD}\" https://localhost:9200/_cluster/health >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 45,
        "start_period": "40s"
      }
    },
    "kibana": {
      "image": "docker.elastic.co/kibana/kibana:8.19.23",
      "mem_limit": "1536m",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "env_file": [
        "./runtime/kibana.env"
      ],
      "environment": {
        "SERVER_NAME": "sentinelhunt-portable",
        "SERVER_HOST": "0.0.0.0",
        "ELASTICSEARCH_HOSTS": "[\"https://elasticsearch:9200\"]",
        "ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES": "/usr/share/kibana/config/ca.crt",
        "ELASTICSEARCH_SSL_VERIFICATIONMODE": "full",
        "NODE_OPTIONS": "--max-old-space-size=768",
        "TELEMETRY_ENABLED": "false"
      },
      "ports": [
        "127.0.0.1:15601:5601"
      ],
      "volumes": [
        "./runtime/ca.crt:/usr/share/kibana/config/ca.crt:ro",
        "kibanadata:/usr/share/kibana/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -sf http://localhost:5601/api/status >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 45,
        "start_period": "60s"
      }
    },
    "logstash": {
      "image": "docker.elastic.co/logstash/logstash:8.19.23",
      "mem_limit": "1280m",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "env_file": [
        "./runtime/logstash.env"
      ],
      "environment": {
        "LS_JAVA_OPTS": "-Xms512m -Xmx512m"
      },
      "ports": [
        "127.0.0.1:18088:8080",
        "127.0.0.1:15514:5514"
      ],
      "volumes": [
        "./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro",
        "./config/pipeline:/usr/share/logstash/pipeline:ro",
        "./runtime/ca.crt:/usr/share/logstash/config/ca.crt:ro",
        "./runtime/inbox:/inbox:ro",
        "logstashdata:/usr/share/logstash/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9600/_node/pipelines/main >/dev/null"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 45,
        "start_period": "60s"
      }
    }
  },
  "volumes": {
    "certs": {},
    "esdata": {},
    "kibanadata": {},
    "logstashdata": {}
  }
}

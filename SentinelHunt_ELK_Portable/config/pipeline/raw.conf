input {
  file {
    id => "folder_pull"
    path => ["/inbox/*.ndjson"]
    mode => "read"
    codec => json
    sincedb_path => "/usr/share/logstash/data/raw.sincedb"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    add_field => { "[@metadata][channel]" => "pull" }
  }
  http {
    id => "endpoint_push"
    host => "0.0.0.0"
    port => 8080
    user => "${PUSH_USER}"
    password => "${PUSH_PASSWORD}"
    codec => json
    add_field => { "[@metadata][channel]" => "push" }
  }
  tcp {
    id => "continuous_stream"
    host => "0.0.0.0"
    port => 5514
    codec => line
    add_field => { "[@metadata][channel]" => "stream" }
  }
}
filter {
  ruby {
    init => "require 'securerandom'; require 'json'"
    code => '
      channel = event.get("[@metadata][channel]")
      timestamp = event.get("@timestamp")
      if channel == "stream"
        begin
          wrapped = JSON.parse(event.get("message"))
          if wrapped.is_a?(Hash) && wrapped["transport_envelope"] == "sentinelhunt.raw.v1"
            ["raw_line", "record_id", "capture_id", "source_name", "feed_name"].each do |key|
              event.set(key, wrapped[key]) unless wrapped[key].nil?
            end
          end
        rescue JSON::ParserError, TypeError
        end
      end
      raw = event.get("raw_line") || (channel == "stream" ? event.get("message") : nil)
      rid = event.get("record_id") || SecureRandom.uuid
      cid = event.get("capture_id")
      source = event.get("source_name")
      feed = event.get("feed_name") || {"pull" => "folder-inbox", "push" => "endpoint-push", "stream" => "local-syslog"}[channel]
      feed_valid = feed.is_a?(String) && !!(feed =~ /\A[A-Za-z0-9_.:-]{1,128}\z/)
      parse_failed = (event.get("tags") || []).include?("_jsonparsefailure")
      valid = feed_valid && !parse_failed && raw.is_a?(String) && !raw.empty? && raw.bytesize <= 262144
      valid = valid && rid.is_a?(String) && !!(rid =~ /\A[A-Za-z0-9_.:-]{1,128}\z/)
      valid = valid && (cid.nil? || (cid.is_a?(String) && cid.length <= 128))
      valid = valid && (source.nil? || (source.is_a?(String) && source.length <= 256))
      event.to_hash.keys.each { |key| event.remove(key) unless key == "@metadata" }
      event.set("@timestamp", timestamp)
      event.set("received_at", timestamp)
      event.set("record_id", valid ? rid : SecureRandom.uuid)
      event.set("ingestion_channel", channel)
      event.set("feed_name", feed_valid ? feed : "invalid-feed")
      if valid
        event.set("raw_line", raw)
        event.set("capture_id", cid) unless cid.nil?
        event.set("source_name", source) unless source.nil?
        event.set("[@metadata][target]", "sentinelhunt-raw-v1")
      else
        event.set("rejection_reason", "invalid_envelope_or_json")
        event.set("[@metadata][target]", "sentinelhunt-rejected-v1")
      end
    '
  }
}
output {
  elasticsearch {
    hosts => ["https://elasticsearch:9200"]
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/ca.crt"]
    ssl_verification_mode => "full"
    index => "%{[@metadata][target]}"
    document_id => "%{[record_id]}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
